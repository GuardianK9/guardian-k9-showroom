name: AdaptIT Investor Video Render

on:
  push:
    branches:
      - adaptit-video-render
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "kokoro>=0.9.4" soundfile requests numpy

      - name: Render AdaptIT investor film
        run: |
          python tools/adaptit_render.py

      - name: Inspect output
        run: |
          ls -lh adaptit-investor.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 adaptit-investor.mp4

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: adaptit-investor-film
          path: adaptit-investor.mp4
          if-no-files-found: error
          retention-days: 7
