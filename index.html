<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Guardian K9 — Field Supply 3D Showroom</title>
<style>
  :root{--bg:#050505;--fg:#f5f5f5;--muted:#9a9a9a}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  #app{position:relative;width:100%;height:100%;background:#050505} canvas{display:block;width:100%;height:100%;touch-action:none}
  .hud{position:absolute;inset:0;pointer-events:none;z-index:10}.brand{position:absolute;left:28px;top:24px;letter-spacing:.18em;text-transform:uppercase}
  .brand .kicker{font-size:11px;color:#aaa}.brand .title{font-size:clamp(34px,5vw,72px);font-weight:900;line-height:.86;letter-spacing:-.05em;margin-top:8px}
  .hint{position:absolute;left:28px;bottom:24px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#aaa;line-height:1.5}
  .hoverLabel{position:absolute;right:28px;bottom:24px;padding:10px 14px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.5);backdrop-filter:blur(10px);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transform:translateY(8px);transition:.25s ease}
  .hoverLabel.show{opacity:1;transform:none}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#050505;z-index:30;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#aaa;transition:opacity .5s ease}.loading.hide{opacity:0;pointer-events:none}
  .accent{position:absolute;width:38vw;height:38vw;max-width:500px;max-height:500px;border-radius:50%;right:-10vw;top:-12vw;background:radial-gradient(circle,rgba(255,60,0,.12),transparent 68%);filter:blur(10px);pointer-events:none}
  .focusBadge{position:absolute;top:26px;right:28px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#aaa;opacity:0;transition:.25s}.focusBadge.show{opacity:1}
  @media (max-width:700px){.brand{left:18px;top:18px}.hint{left:18px;bottom:18px}.hoverLabel{right:18px;bottom:18px}}
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loading">Loading Field Supply</div>
  <div class="hud"><div class="accent"></div><div class="brand"><div class="kicker">Guardian K9</div><div class="title">FIELD<br/>SUPPLY</div></div><div class="focusBadge" id="focusBadge">Drag to inspect · Scroll to zoom</div><div class="hint" id="hint">Move to explore<br/>Click a product</div><div class="hoverLabel" id="hoverLabel"></div></div>
</div>
<script src="./bundle.js" defer></script>
</body>
</html>
